<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Kabiraj — dynamic Matrix developer profile</title>
<desc id="desc">Terminal-style GitHub profile card with the supplied Matrix portrait, animated Matrix rain, and live GitHub telemetry.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3faf7"/>
    <stop offset=".5" stop-color="#eef8f4"/>
    <stop offset="1" stop-color="#f3faf7"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="portraitClip"><rect x="25" y="86" width="380" height="486" rx="10"/></clipPath>
  <style>
    text, tspan { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .muted { fill:#6a8379; }
    .text { fill:#17362b; }
    .green { fill:#087b57; }
    .cyan { fill:#147d9c; }
    .purple { fill:#6c4bb3; }
    .rain { fill:#087b57; opacity:.10; font-size:14px; writing-mode:vertical-rl; animation:fall linear infinite; }
    .rain:nth-child(4n) { fill:#147d9c; opacity:.13; }
    .blink { animation:blink 1.1s steps(1,end) infinite; }
    .pulse { animation:pulse 2.2s ease-in-out infinite; }
    .scan { animation:scan 5s linear infinite; }
    @keyframes fall { from { transform:translateY(-320px); } to { transform:translateY(820px); } }
    @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
    @keyframes pulse { 0%,100% { opacity:.72; } 50% { opacity:1; } }
    @keyframes scan { 0% { transform:translateY(0); opacity:0; } 8% { opacity:.6; } 92% { opacity:.6; } 100% { transform:translateY(486px); opacity:0; } }
  </style>
</defs>

<rect width="1200" height="620" rx="18" fill="url(#bg)" stroke="#c5ddd3" stroke-width="2"/>
<rect x="8" y="8" width="1184" height="604" rx="14" fill="none" stroke="#087b57" stroke-opacity=".22"/>

<!-- Terminal chrome -->
<rect x="18" y="18" width="1164" height="42" rx="10" fill="#eef8f4" stroke="#c5ddd3"/>
