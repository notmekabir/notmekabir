<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Abhishek Kabiraj — cyberpunk developer terminal</title>
  <desc id="desc">Animated Matrix rain, ASCII portrait, terminal-style developer profile and dynamic GitHub statistics for notmekabir.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030907"/>
      <stop offset="55%" stop-color="#07120f"/>
      <stop offset="100%" stop-color="#030907"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35f2a3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#35f2a3" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#35f2a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="matrixClip"><rect x="16" y="78" width="392" height="500" rx="12"/></clipPath>
    <style>
      @font-face {
        src: local('Consolas'), local('Cascadia Mono'), local('Courier New');
        font-family: 'Terminal';
        font-display: swap;
      }
      text, tspan { font-family: Terminal, Consolas, monospace; white-space: pre; }
      .key { fill: #35f2a3; }
      .value { fill: #d7fff0; }
      .muted { fill: #557a6d; }
      .cyan { fill: #58d8ff; }
      .purple { fill: #b38cff; }
      .red { fill: #ff667a; }
      .portrait { fill: #d7fff0; font-size: 16px; }
      .rain { fill: #35f2a3; opacity: .16; font-size: 15px; writing-mode: vertical-rl; animation: fall linear infinite; }
      .rain:nth-of-type(3n) { opacity: .28; }
      .rain:nth-of-type(5n) { fill: #58d8ff; opacity: .18; }
      .blink { animation: blink 1s steps(1,end) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .scanline { animation: scan 4.5s linear infinite; }
      @keyframes fall {
        from { transform: translateY(-250px); }
        to { transform: translateY(820px); }
      }
      @keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes pulse { 0%,100% { opacity:.65; } 50% { opacity:1; } }
      @keyframes scan {
        0% { transform:translateY(80px); opacity:0; }
        12% { opacity:.8; }
        90% { opacity:.8; }
        100% { transform:translateY(560px); opacity:0; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="620" rx="18" fill="url(#bgGrad)" stroke="#16372d" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="604" rx="14" fill="none" stroke="#35f2a3" stroke-opacity=".24"/>

